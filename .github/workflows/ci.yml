name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: reposearch_test
          POSTGRES_USER: reposearch
          POSTGRES_PASSWORD: reposearch
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U reposearch -d reposearch_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit, HTTP and real PostgreSQL integration tests
        run: ./mvnw -B verify
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
            target/site/jacoco
      - name: Verify production container build
        run: docker build -t github-repository-searcher:ci .
