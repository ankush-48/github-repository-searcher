spring:
  application:
    name: github-repository-searcher
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:reposearch}}
    username: ${DB_USERNAME:reposearch}
    password: ${DB_PASSWORD:reposearch}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 10000
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
github:
  base-url: ${GITHUB_API_BASE_URL:https://api.github.com}
  token: ${GITHUB_TOKEN:}
  connect-timeout: 3s
  read-timeout: 10s
springdoc:
  swagger-ui:
    path: /swagger-ui.html
