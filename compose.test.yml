services:
  test-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: reposearch_test
      POSTGRES_USER: reposearch
      POSTGRES_PASSWORD: reposearch
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reposearch -d reposearch_test"]
      interval: 2s
      timeout: 3s
      retries: 20
